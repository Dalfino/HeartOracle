[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-heart"
version = "0.1.0"
description = "Local-first, CPU-only cardiac imaging analysis pipeline with fully-cited clinical report synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project ORACLE" }]
dependencies = [
    "pydicom>=3.0.1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "chromadb>=0.5",
    "cryptography>=42",
]

[project.optional-dependencies]
synth = ["llama-cpp-python>=0.2.90"]
ui = ["gradio>=4.44"]
embed = ["fastembed>=0.3"]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
oracle = "oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # human-run Kaggle scratch cells (§14)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
